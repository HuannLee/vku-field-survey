<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradient màu vàng Champagne Wuthering Waves -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae7be"/>
      <stop offset="50%" stop-color="#e2c285"/>
      <stop offset="100%" stop-color="#ba9348"/>
    </linearGradient>

    <!-- Hiệu ứng tỏa sáng sóng âm dịu mắt -->
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#e2c285" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Nền đen than bo góc chuẩn icon ứng dụng -->
  <rect width="512" height="512" rx="112" fill="#0b0d13"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(226, 194, 133, 0.25)" stroke-width="3"/>

  <!-- 3 cột sóng âm Frequency Wave -->
  <g filter="url(#waveGlow)">
    <!-- Cột trái -->
    <rect x="156" y="140" width="44" height="96" rx="22" fill="url(#goldGrad)"/>
    <!-- Cột giữa cao nhất -->
    <rect x="234" y="80" width="44" height="210" rx="22" fill="url(#goldGrad)"/>
    <!-- Cột phải -->
    <rect x="312" y="115" width="44" height="150" rx="22" fill="url(#goldGrad)"/>
  </g>

  <!-- Chữ VKU nét đậm phong cách công nghệ -->
  <g filter="url(#waveGlow)">
    <text x="256" y="415" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="86" 
          font-weight="900" 
          letter-spacing="12" 
          fill="url(#goldGrad)">VKU</text>
  </g>
</svg>
